<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Thẻ Bài Trí Tuệ Socratic</title>
    <style>
        :root {
            --primary-color: #4a90e2;
            --secondary-color: #2c3e50;
            --accent-color: #e74c3c;
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .container {
            max-width: 800px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: var(--secondary-color);
            margin-bottom: 20px;
        }

        /* Panel Điều Khiển */
        .control-panel {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 30px;
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        select, button {
            padding: 12px 20px;
            font-size: 16px;
            border-radius: 8px;
            border: 1px solid #ddd;
            outline: none;
            transition: all 0.3s ease;
        }

        select {
            background-color: #fff;
            cursor: pointer;
        }

        .btn-draw {
            background-color: var(--primary-color);
            color: white;
            border: none;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(74, 144, 226, 0.3);
        }

        .btn-draw:hover {
            background-color: #357abd;
            transform: translateY(-2px);
        }

        /* Khung Thẻ Bài 3D */
        .card-container {
            perspective: 1000px;
            width: 100%;
            max-width: 550px;
            height: 380px;
            margin: 0 auto;
        }

        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        .card.flipped {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 16px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: var(--card-bg);
            border: 2px solid #e1e8ed;
        }

        .card-back {
            transform: rotateY(180deg);
            background: #fafafa;
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid #f0f0f0;
            padding-bottom: 10px;
            font-size: 14px;
            color: #7f8c8d;
            font-weight: bold;
        }

        .card-body {
            font-size: 18px;
            color: #333;
            line-height: 1.6;
            margin: 10px 0;
            overflow-y: auto;
            text-align: left;
            flex-grow: 1;
        }

        .card-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
        }

        .btn-sub {
            padding: 8px 14px;
            font-size: 13px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-weight: 600;
        }

        .btn-answer {
            background-color: #27ae60;
            color: white;
        }

        .btn-detail {
            background-color: #8e44ad;
            color: white;
        }

        .btn-sub:hover {
            opacity: 0.9;
        }

        /* Styles cho khung Đáp án bên dưới thẻ */
        .content-box {
            display: none;
            text-align: left;
            padding: 14px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 16px;
            transition: all 0.3s ease;
        }

        /* Kiểu giao diện ĐÚNG (Xanh) */
        .content-box.correct {
            background: #e8f8f5;
            border-left: 5px solid #27ae60;
            color: #1e8449;
        }

        /* Kiểu giao diện DỐI/SAI (Đỏ) */
        .content-box.wrong {
            background: #fadbd8;
            border-left: 5px solid #e74c3c;
            color: #78281f;
        }

        #status-msg {
            color: #27ae60;
            font-style: italic;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Hệ Thống Thẻ Bài Board game AI vs.Human Mind</h1>

    <!-- Panel Điều Khiển -->
    <div class="control-panel">
        <select id="gradeSelect">
            <option value="">-- Chọn Khối Lớp --</option>
            <option value="10">Khối 10</option>
            <option value="11">Khối 11</option>
            <option value="12">Khối 12</option>
        </select>

        <select id="subjectSelect">
            <option value="">-- Chọn Môn Học --</option>
            <option value="Toan">Môn Toán</option>
            <option value="Ly">Môn Vật Lý</option>
            <option value="Hoa">Môn Hóa Học</option>
            <option value="Sinh">Môn Sinh Học</option>
            <option value="Van">Môn Ngữ Văn</option>
        </select>

        <button class="btn-draw" onclick="drawCard()">🎲 Rút Thẻ Ngẫu Nhiên</button>
    </div>

    <!-- Khung Thẻ Bài 3D -->
    <div class="card-container">
        <div class="card" id="cardElement">
            
            <!-- Mặt Trước Thẻ Bài -->
            <div class="card-front">
                <div class="card-header">
                    <span id="frontMeta">Môn Học - Lớp</span>
                    <span>Học mà chơi,Chơi mà học</span>
                </div>
                <div class="card-body" id="cardQuestion">
                    Vui lòng chọn Khối Lớp, Môn Học và nhấn "Rút Thẻ Ngẫu Nhiên" để bắt đầu thử thách!
                </div>
                <div class="card-actions">
                    <button class="btn-sub btn-answer" onclick="showSection('answer')">💡 Đáp Án Socratic</button>
                    <button class="btn-sub btn-detail" onclick="flipToBack()">🔍 Giải Thích Chi Tiết</button>
                </div>
            </div>

            <!-- Mặt Sau Thẻ Bài (Đã đẩy dòng giải thích lên trên cùng) -->
            <div class="card-back">
                <div class="card-header">
                    <span>Phân Tích Chi Tiết</span>
                    <button onclick="flipToFront()" style="padding: 2px 8px; font-size: 12px; cursor: pointer;">↩ Quay lại</button>
                </div>
                <div class="card-body" style="justify-content: flex-start;">
                    <strong style="color: #2980b9; display: block; font-size: 18px; margin-top: 5px; margin-bottom: 8px;">📝 Giải thích chi tiết & Bài học:</strong>
                    <p id="detailedExplanationText" style="font-size: 17px; line-height: 1.7; margin-top: 0; color: #2c3e50;">...</p>
                </div>
            </div>

        </div>
    </div>

    <!-- Khung Hiển Thị Đáp Án Socratic (Đổi màu & icon tự động) -->
    <div id="answerBox" class="content-box">
        <strong id="answerHeader">✅ Kết luận đáp án:</strong>
        <p id="correctAnswerText" style="margin: 5px 0 0 0; font-weight: bold; font-size: 17px;">...</p>
    </div>

    <div id="status-msg"></div>
</div>

<script>
    // Đường link API Web App của bạn từ Apps Script
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw12itK3q9xKfFdsGp7G9DjKRsBCHjsQ_JhXf6CFP5muJHYmnut3cpo0N9anrKy6b0hag/exec';

    let questionsDatabase = [];
    let currentCard = null;

    function normalizeSubject(str) {
        if (!str) return '';
        str = str.toString().trim().toLowerCase();
        if (str.includes('toán') || str.includes('toan')) return 'toan';
        if (str.includes('lý') || str.includes('ly')) return 'ly';
        if (str.includes('hóa') || str.includes('hoa')) return 'hoa';
        if (str.includes('sinh')) return 'sinh';
        if (str.includes('văn') || str.includes('van')) return 'van';
        return str;
    }

    async function loadQuestions() {
        const msg = document.getElementById('status-msg');
        msg.innerText = 'Đang đồng bộ 225 câu hỏi từ hệ thống...';
        
        try {
            const response = await fetch(APPS_SCRIPT_URL);
            questionsDatabase = await response.json();
            
            if (Array.isArray(questionsDatabase) && questionsDatabase.length > 0) {
                msg.innerText = `Đã tải thành công ${questionsDatabase.length} câu hỏi!`;
            } else {
                msg.innerText = 'Dữ liệu trả về rỗng, vui lòng kiểm tra lại Google Sheet.';
                msg.style.color = '#c0392b';
            }
        } catch (error) {
            console.error('Lỗi tải dữ liệu:', error);
            msg.innerText = 'Lỗi kết nối dữ liệu Google Sheet.';
            msg.style.color = '#c0392b';
        }
    }

    function drawCard() {
        const grade = document.getElementById('gradeSelect').value.toString().trim();
        const subject = normalizeSubject(document.getElementById('subjectSelect').value);

        if (!grade || !subject) {
            alert('Vui lòng chọn đầy đủ Khối Lớp và Môn Học!');
            return;
        }

        if (questionsDatabase.length === 0) {
            alert('Dữ liệu chưa tải xong! Vui lòng đợi trong giây lát.');
            return;
        }

        const filtered = questionsDatabase.filter(q => {
            const qGrade = q.grade ? q.grade.toString().trim() : '';
            const qSubject = normalizeSubject(q.subject);
            return qGrade === grade && qSubject === subject;
        });

        if (filtered.length === 0) {
            alert(`Không tìm thấy câu hỏi cho Lớp ${grade} - Môn ${subject.toUpperCase()}!`);
            return;
        }

        flipToFront();
        document.getElementById('answerBox').style.display = 'none';

        const randomIndex = Math.floor(Math.random() * filtered.length);
        currentCard = filtered[randomIndex];

        document.getElementById('frontMeta').innerText = `Lớp ${currentCard.grade} - Môn ${getSubjectName(currentCard.subject)}`;
        document.getElementById('cardQuestion').innerText = currentCard.question;
        
        // Xử lý hiển thị Đáp án & Đổi giao diện Đỏ / Xanh
        const answerText = currentCard.correctAnswer || '';
        document.getElementById('correctAnswerText').innerText = answerText;

        const answerBox = document.getElementById('answerBox');
        const answerHeader = document.getElementById('answerHeader');

        if (answerText.toLowerCase().includes('dối') || answerText.toLowerCase().includes('sai')) {
            // Khi AI NÓI DỐI -> Nền Đỏ + Icon ❌
            answerBox.className = 'content-box wrong';
            answerHeader.innerText = '❌ Kết luận đáp án:';
        } else {
            // Khi AI NÓI ĐÚNG -> Nền Xanh + Icon ✅
            answerBox.className = 'content-box correct';
            answerHeader.innerText = '✅ Kết luận đáp án:';
        }

        document.getElementById('detailedExplanationText').innerText = currentCard.detailedExplanation || 'Chưa có giải thích chi tiết.';
    }

    function getSubjectName(code) {
        const norm = normalizeSubject(code);
        const names = {
            'toan': 'TOÁN HỌC',
            'ly': 'VẬT LÝ',
            'hoa': 'HÓA HỌC',
            'sinh': 'SINH HỌC',
            'van': 'NGỮ VĂN'
        };
        return names[norm] || code.toUpperCase();
    }

    function flipToBack() {
        if (!currentCard) {
            alert('Hãy nhấn "Rút Thẻ Ngẫu Nhiên" trước!');
            return;
        }
        document.getElementById('cardElement').classList.add('flipped');
    }

    function flipToFront() {
        document.getElementById('cardElement').classList.remove('flipped');
    }

    function showSection(type) {
        if (!currentCard) {
            alert('Hãy nhấn "Rút Thẻ Ngẫu Nhiên" trước!');
            return;
        }
        if (type === 'answer') {
            const answerBox = document.getElementById('answerBox');
            answerBox.style.display = answerBox.style.display === 'block' ? 'none' : 'block';
        }
    }

    window.onload = loadQuestions;
</script>

</body>
</html>
